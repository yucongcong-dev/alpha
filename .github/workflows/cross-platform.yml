name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Windows check tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make ripgrep --yes --no-progress

      - name: Install macOS check tools
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Validate matrix Python
        run: make python-version-check PYTHON=python

      - name: Install project dependencies
        run: make install-dev PYTHON=python

      - name: Run repository checks
        run: make check PYTHON=python RUFF="python -m ruff"
