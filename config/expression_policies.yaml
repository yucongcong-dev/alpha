# ============================================================================
# expression_policies.yaml — 数据集表达式策略覆盖
# ============================================================================
# 这部分用于承接"原先只能在 config.py 里改的表达式搜索常量"。
# 代码仍提供内置默认值，但以下配置可按数据集覆盖，用于：
#   - partner / ratio 搜索偏好
#   - 模板优先级加成与降权
#   - 字段排序与过滤阈值
#   - 各类弱模板/保护模板名单
# 如果某个键未配置，继续使用代码内默认值。
# ============================================================================

expression_policies:
  # --------------------------------------------------------------------------
  # __default__ — 所有数据集的通用优先级与字段探索策略
  # --------------------------------------------------------------------------
  __default__:
    policy_version: "2026-07-30.1"
    feedback_scope: "field_type"
    field_min_coverage: 0.20
    field_min_date_coverage: 0.90
    field_min_alpha_count: 10
    field_min_user_count: 3
    field_max_alpha_count: 10000
    field_max_user_count: 5000
    field_max_per_family: 2
    field_exploration_ratio: 0.40
    field_feedback_half_life_days: 365
    field_feedback_min_attempts_for_promising: 2
    preferred_field_type_order:
      MATRIX: 0
      VECTOR: 1
      GROUP: 2
      SET: 3
    priority_tiers:
      account_boost: 820          # account_ 前缀模板加成
      high_conviction_boost: 780  # 高信心 ratio 模板加成
      heavy_penalty: -820         # 噪音过高模板
      deep_penalty: -760          # delta_ 前缀降权
      moderate_penalty: -260      # 中等降权
      light_penalty: -240         # 较轻降权
      mild_penalty: -220          # 轻微降权
      minor_penalty: -200         # 微小降权
      small_penalty: -180         # 极轻降权

  # --------------------------------------------------------------------------
  # fundamental6 — 季度财报数据
  # --------------------------------------------------------------------------
  fundamental6:
    # Maintenance pool: the active strategy lives in datasets/fundamental6/presets.
    # Keep the default dataset library closed and do not auto-expand ratio/event neighbors.
    use_curated_heuristics: false
    closed_default_template_library: true
    partner_limit: 0
    default_field_transform:
      stages: []
      backfill_window: 0
    matrix_field_transform:
      stages:
        - kind: "backfill"
          window: 120
        - kind: "winsorize"
          std: 4
      backfill_window: 120
    vector_field_transform:
      stages:
        - kind: "backfill"
          window: 120
        - kind: "winsorize"
          std: 4
      backfill_window: 120
    ratio_numerator_transform:
      stages:
        - kind: "backfill"
          window: 120
        - kind: "winsorize"
          std: 4
      backfill_window: 120
    ratio_denominator_transform:
      stages:
        - kind: "backfill"
          window: 120
        - kind: "winsorize"
          std: 4
      backfill_window: 120
    feedback_loop_policy:
      generate:
        min_attempted_templates: 0
        min_best_score: -999.0
        settings_variant_budget: 1
      resimulate:
        min_attempted_templates: 0
        min_best_score: -999.0
        settings_variant_budget: 1
        enable_template_pruning: false
    account_template_boost: 0
    high_conviction_ratio_priority_boost: 0
    protected_templates:
      - "cashflow_assets_industry_zscore_252"
      - "cashflow_enterprise_value_industry_zscore_252"
      - "cashflow_cap_bucket_delta_over_std_63_126"
      - "cashflow_change_trade_when_assets_zscore_252"
      - "hc_ratio_group_zscore_252_over_cap"
      - "group_ratio_delta_over_std_63_126_over_cap"
    high_conviction_ratio_pairs:
      - ["cashflow_op", "cap"]
    matrix_delta_over_std_windows: []
    matrix_diversified_template_specs: []
    ratio_delta_rank_windows: []
    ratio_delta_over_std_windows: []
    ratio_diversified_template_specs: []
    ratio_partner_candidates: {}
    ratio_keywords: {}
    preferred_partner_score_bonuses: {}
    preferred_field_order:
      cashflow_op: 0
    promising_field_min_priority: 0.65
    blacklist_min_fields_for_nearpass: 0
    blacklist_protected_min_avg_sharpe: 0.70
    blacklist_protected_min_avg_fitness: 0.35
    field_min_coverage: 0.20
    field_min_date_coverage: 0.98
    field_min_alpha_count: 40
    field_min_user_count: 8
    field_max_alpha_count: 0
    field_max_user_count: 0
    event_field_prefixes: []
    event_max_templates_per_field: 0
    event_max_templates_per_family: 0
    event_allowed_template_stages: []
    event_allowed_template_prefixes: []
    event_allowed_template_families: []

